<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">MusicCloud realtime community infographic</title><desc id="desc">MusicCloud connects listening, conversation and live voice through a realtime event layer.</desc><defs><linearGradient id="b" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#08151c"/><stop offset="1" stop-color="#12283a"/></linearGradient><linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{fill:#fff;font-size:34px;font-weight:850}.body{fill:#cbd5e1;font-size:20px}.muted{fill:#94a3b8;font-size:17px}.tag{fill:#67e8f9;font-size:15px;font-weight:800;letter-spacing:3px}</style></defs><rect width="1400" height="820" rx="32" fill="url(#b)"/><text x="70" y="75" class="tag">03 / REALTIME COMMUNITY</text><text x="70" y="125" class="h">The music is the start of the conversation.</text><text x="70" y="165" class="body">One persistent social layer keeps the room alive while people listen, respond, and show up together.</text><g transform="translate(70 250)"><rect width="1260" height="410" rx="30" fill="#07121d" stroke="#164e63"/><circle cx="630" cy="205" r="100" fill="#0e7490" opacity=".28"/><circle cx="630" cy="205" r="48" fill="#164e63" stroke="#67e8f9" stroke-width="4"/><path d="M606 207h48M630 183v48" stroke="#a5f3fc" stroke-width="8" stroke-linecap="round"/><path d="M630 106V80M630 330v-26M531 205h-26M755 205h-26M559 134l-19-19M701 276l-19-19M701 134l19-19M559 276l-19 19" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" opacity=".7"/><g transform="translate(65 70)"><rect width="300" height="105" rx="20" fill="#0f2635" stroke="#22d3ee"/><text x="26" y="42" fill="#fff" font-size="22" font-weight="800">Listening</text><text x="26" y="73" class="muted">waveform comments • likes</text></g><g transform="translate(895 70)"><rect width="300" height="105" rx="20" fill="#171c3b" stroke="#818cf8"/><text x="26" y="42" fill="#fff" font-size="22" font-weight="800">Messaging</text><text x="26" y="73" class="muted">private DMs • typing • alerts</text></g><g transform="translate(65 250)"><rect width="300" height="105" rx="20" fill="#172a25" stroke="#34d399"/><text x="26" y="42" fill="#fff" font-size="22" font-weight="800">Live Spaces</text><text x="26" y="73" class="muted">browser voice rooms • WebRTC</text></g><g transform="translate(895 250)"><rect width="300" height="105" rx="20" fill="#2a1a2e" stroke="#f472b6"/><text x="26" y="42" fill="#fff" font-size="22" font-weight="800">Signals</text><text x="26" y="73" class="muted">SSE events • presence • follows</text></g></g><text x="700" y="730" text-anchor="middle" fill="#bae6fd" font-size="19" font-weight="700">listen alone → respond together → become part of the scene</text></svg>