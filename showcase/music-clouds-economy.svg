<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
    <title id="title">Music Clouds reward loop</title><desc id="desc">Authors contribute records to a block, the block is mined, and Music Clouds are distributed pro-rata to contributors.</desc>
    <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131b"/><stop offset=".55" stop-color="#10192b"/><stop offset="1" stop-color="#1f1237"/></linearGradient><linearGradient id="lime" x1="0" x2="1"><stop stop-color="#d9f99d"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
    <rect width="1400" height="800" rx="44" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="90" y="92" fill="#bef264" font-size="18" font-weight="800" letter-spacing="5">MUSICCLOUD / VALUE LOOP</text><text x="90" y="160" fill="#f8fafc" font-size="52" font-weight="900">Music Clouds come from work.</text><text x="90" y="202" fill="#aab5cc" font-size="21">No issuance button. No fiat peg. The block is the source.</text>
    <path d="M350 355 C470 215 650 215 770 355 S1070 495 1190 355" fill="none" stroke="#344461" stroke-width="5" stroke-dasharray="13 13"/><path d="M1190 355 C1070 610 800 655 590 500 S330 265 210 500" fill="none" stroke="#344461" stroke-width="5" stroke-dasharray="13 13"/>
    <g><circle cx="210" cy="500" r="86" fill="#102235" stroke="#67e8f9" stroke-width="3"/><text x="210" y="490" text-anchor="middle" fill="#67e8f9" font-size="16" font-weight="800" letter-spacing="2">01</text><text x="210" y="525" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="800">Contribute</text>
    <circle cx="350" cy="275" r="86" fill="#1b1733" stroke="#a78bfa" stroke-width="3"/><text x="350" y="265" text-anchor="middle" fill="#d8b4fe" font-size="16" font-weight="800" letter-spacing="2">02</text><text x="350" y="300" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="800">Anchor</text>
    <circle cx="700" cy="205" r="104" fill="#172313" stroke="#bef264" stroke-width="4"/><text x="700" y="190" text-anchor="middle" fill="#d9f99d" font-size="16" font-weight="800" letter-spacing="2">03</text><text x="700" y="230" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="900">Mine block</text><text x="700" y="260" text-anchor="middle" fill="#aab5cc" font-size="15">hash-derived reward</text>
    <circle cx="1050" cy="275" r="86" fill="#172313" stroke="#34d399" stroke-width="3"/><text x="1050" y="265" text-anchor="middle" fill="#bbf7d0" font-size="16" font-weight="800" letter-spacing="2">04</text><text x="1050" y="300" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="800">Distribute</text>
    <circle cx="1190" cy="500" r="86" fill="#102235" stroke="#67e8f9" stroke-width="3"/><text x="1190" y="490" text-anchor="middle" fill="#67e8f9" font-size="16" font-weight="800" letter-spacing="2">05</text><text x="1190" y="525" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="800">Verify</text></g>
    <rect x="90" y="660" width="1220" height="2" fill="#293452"/><text x="90" y="710" fill="#aab5cc" font-size="18">Entries share the reward pro-rata by contribution.</text><text x="1310" y="710" text-anchor="end" fill="#d9f99d" font-size="18" font-weight="800">18 DECIMALS · BIGINT-SAFE</text></g></svg>