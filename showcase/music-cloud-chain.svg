<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
    <title id="title">MusicCloud native chain protocol map</title><desc id="desc">Wallet identity, public record, edit window, hash-linked block, and proof with reward distribution.</desc>
    <defs>
      <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#080a18"/><stop offset=".55" stop-color="#15102e"/><stop offset="1" stop-color="#082b35"/></linearGradient>
      <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
      <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
      <linearGradient id="green" x1="0" x2="1"><stop stop-color="#bef264"/><stop offset="1" stop-color="#34d399"/></linearGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
    <circle cx="1380" cy="120" r="260" fill="#7c3aed" opacity=".12" filter="url(#glow)"/><circle cx="90" cy="760" r="260" fill="#0891b2" opacity=".12" filter="url(#glow)"/>
    <g font-family="Inter,Arial,sans-serif">
      <text x="100" y="92" fill="#67e8f9" font-size="18" font-weight="800" letter-spacing="5">MUSICCLOUD / PROTOCOL MAP</text>
      <text x="100" y="160" fill="#f8fafc" font-size="56" font-weight="900">A better chain for music provenance.</text>
      <text x="100" y="202" fill="#aab5cc" font-size="22">Each public record gets a verifiable place in the story.</text>
      <g stroke="#5b6381" stroke-width="3" stroke-dasharray="8 12" fill="none"><path d="M365 470H415"/><path d="M675 470H725"/><path d="M985 470H1035"/><path d="M1295 470H1345"/></g>
      <g fill="#aab5cc"><path d="m407 458 18 12-18 12z"/><path d="m717 458 18 12-18 12z"/><path d="m1027 458 18 12-18 12z"/><path d="m1337 458 18 12-18 12z"/></g>
      <g>
        <rect x="100" y="330" width="265" height="280" rx="24" fill="#10172a" stroke="#67e8f9" stroke-width="2"/><circle cx="148" cy="380" r="25" fill="#164e63"/><text x="138" y="388" fill="#67e8f9" font-size="22" font-weight="900">01</text><text x="130" y="445" fill="#f8fafc" font-size="24" font-weight="800">Wallet identity</text><text x="130" y="482" fill="#aab5cc" font-size="17">A signed wallet proves</text><text x="130" y="507" fill="#aab5cc" font-size="17">who published the work.</text><text x="130" y="565" fill="#67e8f9" font-size="14" font-weight="700" letter-spacing="2">OWNERSHIP</text>
        <rect x="410" y="330" width="265" height="280" rx="24" fill="#16132e" stroke="#a78bfa" stroke-width="2"/><circle cx="458" cy="380" r="25" fill="#3b256b"/><text x="448" y="388" fill="#d8b4fe" font-size="22" font-weight="900">02</text><text x="440" y="445" fill="#f8fafc" font-size="24" font-weight="800">Public record</text><text x="440" y="482" fill="#aab5cc" font-size="17">Tracks, posts, and</text><text x="440" y="507" fill="#aab5cc" font-size="17">transfers enter the queue.</text><text x="440" y="565" fill="#d8b4fe" font-size="14" font-weight="700" letter-spacing="2">CONTEXT</text>
        <rect x="720" y="330" width="265" height="280" rx="24" fill="#16132e" stroke="#f0abfc" stroke-width="2"/><circle cx="768" cy="380" r="25" fill="#642c68"/><text x="758" y="388" fill="#f5d0fe" font-size="22" font-weight="900">03</text><text x="750" y="445" fill="#f8fafc" font-size="24" font-weight="800">Edit window</text><text x="750" y="482" fill="#aab5cc" font-size="17">The record settles after</text><text x="750" y="507" fill="#aab5cc" font-size="17">its edit window closes.</text><text x="750" y="565" fill="#f5d0fe" font-size="14" font-weight="700" letter-spacing="2">FINALITY</text>
        <rect x="1030" y="330" width="265" height="280" rx="24" fill="#11211f" stroke="#34d399" stroke-width="2"/><circle cx="1078" cy="380" r="25" fill="#14532d"/><text x="1068" y="388" fill="#bbf7d0" font-size="22" font-weight="900">04</text><text x="1060" y="445" fill="#f8fafc" font-size="24" font-weight="800">MC-2 block</text><text x="1060" y="482" fill="#aab5cc" font-size="17">SHA-256 hashes and</text><text x="1060" y="507" fill="#aab5cc" font-size="17">Merkle roots bind history.</text><text x="1060" y="565" fill="#bbf7d0" font-size="14" font-weight="700" letter-spacing="2">ANCHOR</text>
        <rect x="1340" y="330" width="160" height="280" rx="24" fill="#11211f" stroke="#bef264" stroke-width="2"/><circle cx="1388" cy="380" r="25" fill="#365314"/><text x="1378" y="388" fill="#d9f99d" font-size="22" font-weight="900">05</text><text x="1370" y="445" fill="#f8fafc" font-size="24" font-weight="800">Proof</text><text x="1370" y="482" fill="#aab5cc" font-size="17">Readers verify</text><text x="1370" y="507" fill="#aab5cc" font-size="17">the trail.</text><text x="1370" y="565" fill="#d9f99d" font-size="14" font-weight="700" letter-spacing="2">TRUST</text>
      </g>
      <rect x="100" y="724" width="1400" height="2" fill="#293452"/><text x="100" y="775" fill="#aab5cc" font-size="19">MusicCloud is not a speculative token wrapper.</text><text x="100" y="812" fill="#f8fafc" font-size="24" font-weight="800">It is a public memory layer for the music network.</text><text x="1500" y="812" text-anchor="end" fill="#67e8f9" font-size="17" font-weight="700">mc-2 · SHA-256 · MERKLE</text>
    </g>
    </svg>