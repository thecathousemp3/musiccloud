<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
    <title id="title">MusicCloud trust and proof model</title><desc id="desc">A central MC-2 verification core connected to content hash, media manifest, Merkle proof, and validator checkpoint.</desc>
    <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080a18"/><stop offset="1" stop-color="#1d1233"/></linearGradient><linearGradient id="ring" x1="0" x2="1"><stop stop-color="#67e8f9"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
    <rect width="1400" height="900" rx="44" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="90" y="94" fill="#a78bfa" font-size="18" font-weight="800" letter-spacing="5">MUSICCLOUD / TRUST MODEL</text><text x="90" y="162" fill="#f8fafc" font-size="52" font-weight="900">Verification has layers.</text><text x="90" y="204" fill="#aab5cc" font-size="21">One record. Several independent ways to make its history legible.</text>
    <circle cx="700" cy="500" r="218" fill="none" stroke="#27314f" stroke-width="3"/><circle cx="700" cy="500" r="177" fill="#0e1628" stroke="url(#ring)" stroke-width="7"/><circle cx="700" cy="500" r="118" fill="#13112a" stroke="#67e8f9" stroke-width="2"/><text x="700" y="475" text-anchor="middle" fill="#67e8f9" font-size="19" font-weight="800" letter-spacing="4">MC-2</text><text x="700" y="515" text-anchor="middle" fill="#f8fafc" font-size="32" font-weight="900">VERIFY</text><text x="700" y="550" text-anchor="middle" fill="#aab5cc" font-size="16">public proof core</text>
    <g fill="none" stroke="#7180aa" stroke-width="3" stroke-dasharray="7 9"><path d="M520 360 430 295"/><path d="M880 360 970 295"/><path d="M520 640 430 705"/><path d="M880 640 970 705"/></g>
    <g><rect x="110" y="230" width="320" height="150" rx="24" fill="#10172a" stroke="#67e8f9" stroke-width="2"/><text x="145" y="278" fill="#67e8f9" font-size="14" font-weight="800" letter-spacing="2">01 / CONTENT HASH</text><text x="145" y="318" fill="#f8fafc" font-size="22" font-weight="800">What was published?</text><text x="145" y="349" fill="#aab5cc" font-size="16">A deterministic digest catches change.</text>
    <rect x="970" y="230" width="320" height="150" rx="24" fill="#17132f" stroke="#a78bfa" stroke-width="2"/><text x="1005" y="278" fill="#d8b4fe" font-size="14" font-weight="800" letter-spacing="2">02 / MEDIA MANIFEST</text><text x="1005" y="318" fill="#f8fafc" font-size="22" font-weight="800">Which assets belong?</text><text x="1005" y="349" fill="#aab5cc" font-size="16">Audio, cover art, and chunks stay auditable.</text>
    <rect x="110" y="630" width="320" height="150" rx="24" fill="#17132f" stroke="#f0abfc" stroke-width="2"/><text x="145" y="678" fill="#f5d0fe" font-size="14" font-weight="800" letter-spacing="2">03 / MERKLE PROOF</text><text x="145" y="718" fill="#f8fafc" font-size="22" font-weight="800">Where is it in the block?</text><text x="145" y="749" fill="#aab5cc" font-size="16">A compact path proves inclusion.</text>
    <rect x="970" y="630" width="320" height="150" rx="24" fill="#11211f" stroke="#34d399" stroke-width="2"/><text x="1005" y="678" fill="#bbf7d0" font-size="14" font-weight="800" letter-spacing="2">04 / CHECKPOINT</text><text x="1005" y="718" fill="#f8fafc" font-size="22" font-weight="800">Who supports the tip?</text><text x="1005" y="749" fill="#aab5cc" font-size="16">Validators attest to the displayed history.</text></g>
    <text x="700" y="850" text-anchor="middle" fill="#67e8f9" font-size="17" font-weight="700" letter-spacing="3">PROVENANCE IS A PRODUCT FEATURE</text></g></svg>