<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">MusicCloud creator ownership infographic</title><desc id="desc">A creator-owned music loop from upload to Base L2 edition to collector resale.</desc><defs><linearGradient id="b" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#120c22"/><stop offset="1" stop-color="#28132f"/></linearGradient><linearGradient id="pink" x1="0" x2="1"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#c084fc"/></linearGradient><linearGradient id="green" x1="0" x2="1"><stop stop-color="#4ade80"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{fill:#fff;font-size:34px;font-weight:850}.body{fill:#cbd5e1;font-size:20px}.muted{fill:#a1a1aa;font-size:17px}.tag{fill:#f0abfc;font-size:15px;font-weight:800;letter-spacing:3px}</style></defs><rect width="1400" height="820" rx="32" fill="url(#b)"/><text x="70" y="75" class="tag">02 / CREATOR OWNERSHIP</text><text x="70" y="125" class="h">The track stays yours. The upside follows it.</text><text x="70" y="165" class="body">MusicCloud makes the path from upload to collectible legible, direct, and wallet-native.</text><path d="M400 440H500M900 440H1000" stroke="#64748b" stroke-width="3" stroke-dasharray="9 12"/><path d="M488 430l18 10-18 10M988 430l18 10-18 10" fill="none" stroke="#e2e8f0" stroke-width="3"/><g transform="translate(70 260)"><rect width="330" height="350" rx="26" fill="#1b142b" stroke="#f472b6"/><text x="35" y="64" fill="#f9a8d4" font-size="16" font-weight="800" letter-spacing="3">01 / MAKE</text><circle cx="165" cy="155" r="70" fill="#3f1d4f"/><path d="M135 178c22-57 46-57 63-28 12 20 22 20 30 5" fill="none" stroke="#f9a8d4" stroke-width="10" stroke-linecap="round"/><text x="35" y="278" fill="#fff" font-size="28" font-weight="850">Upload your work</text><text x="35" y="315" class="muted">Tracks, photos, video, voice.</text></g><g transform="translate(505 220)"><rect width="395" height="440" rx="26" fill="#131b2d" stroke="#60a5fa"/><text x="35" y="64" fill="#93c5fd" font-size="16" font-weight="800" letter-spacing="3">02 / MINT</text><rect x="35" y="104" width="325" height="190" rx="18" fill="#172554"/><circle cx="197" cy="198" r="59" fill="none" stroke="url(#green)" stroke-width="5"/><path d="M171 200l20 20 37-44" fill="none" stroke="#86efac" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="350" fill="#fff" font-size="28" font-weight="850">Edition on Base L2</text><text x="35" y="388" class="muted">ERC-1155 • direct artist wallet</text><text x="35" y="424" fill="#86efac" font-size="18" font-weight="800">97% artist / 3% platform</text></g><g transform="translate(1005 260)"><rect width="325" height="350" rx="26" fill="#13251f" stroke="#4ade80"/><text x="35" y="64" fill="#86efac" font-size="16" font-weight="800" letter-spacing="3">03 / CIRCULATE</text><circle cx="162" cy="155" r="70" fill="#14532d"/><path d="M126 145h72M162 109v92" stroke="#bbf7d0" stroke-width="10" stroke-linecap="round"/><text x="35" y="278" fill="#fff" font-size="28" font-weight="850">Collect + resell</text><text x="35" y="315" class="muted">Ownership and royalties remain visible.</text></g><rect x="230" y="700" width="940" height="54" rx="27" fill="#0b1220" stroke="#475569"/><text x="700" y="735" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="700">one wallet • one provenance trail • no platform custody of the artist payout</text></svg>