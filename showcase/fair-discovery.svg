<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">MusicCloud fair discovery infographic</title><desc id="desc">The discovery rotation gives quieter tracks priority while a separate trending cap prevents one artist from taking over.</desc><defs><linearGradient id="b" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#18213d"/></linearGradient><linearGradient id="p" x1="0" x2="1"><stop stop-color="#f472b6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="c" x1="0" x2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{fill:#fff;font-size:34px;font-weight:850}.body{fill:#cbd5e1;font-size:20px}.muted{fill:#94a3b8;font-size:16px}.tag{fill:#a5b4fc;font-size:15px;font-weight:800;letter-spacing:3px;text-transform:uppercase}</style></defs><rect width="1400" height="820" rx="32" fill="url(#b)"/><text x="70" y="75" class="tag">01 / FAIR DISCOVERY</text><text x="70" y="125" class="h">The spotlight moves. It does not belong to one artist.</text><text x="70" y="165" class="body">MusicCloud separates discovery from popularity so a new upload can actually be heard.</text><g transform="translate(70 230)"><rect width="770" height="500" rx="26" fill="#0b1222" stroke="#334155"/><text x="42" y="58" class="h" font-size="28">Rotation queue</text><text x="42" y="92" class="muted">Priority = longest since last feature + least-heard signal</text><g transform="translate(42 135)"><rect width="680" height="72" rx="16" fill="#13243c"/><circle cx="38" cy="36" r="16" fill="#22d3ee"/><text x="72" y="31" fill="#fff" font-size="21" font-weight="800">new signal / 0 followers</text><text x="72" y="56" class="muted">moves forward because it has not had a turn</text><text x="630" y="44" text-anchor="end" fill="#67e8f9" font-size="24" font-weight="900">01</text></g><g transform="translate(42 225)"><rect width="680" height="72" rx="16" fill="#171d3e"/><circle cx="38" cy="36" r="16" fill="#a78bfa"/><text x="72" y="31" fill="#fff" font-size="21" font-weight="800">rising artist / small catalog</text><text x="72" y="56" class="muted">time in the room keeps compounding</text><text x="630" y="44" text-anchor="end" fill="#c4b5fd" font-size="24" font-weight="900">02</text></g><g transform="translate(42 315)"><rect width="680" height="72" rx="16" fill="#251834"/><circle cx="38" cy="36" r="16" fill="#f472b6"/><text x="72" y="31" fill="#fff" font-size="21" font-weight="800">established artist / just featured</text><text x="72" y="56" class="muted">steps back instead of occupying every slot</text><text x="630" y="44" text-anchor="end" fill="#f9a8d4" font-size="24" font-weight="900">03</text></g><path d="M42 432h680" stroke="#334155"/><text x="42" y="467" class="muted">No pay-to-play boost. No follower-count gate.</text></g><g transform="translate(900 230)"><rect width="430" height="500" rx="26" fill="#0b1222" stroke="#7c3aed"/><text x="40" y="58" class="h" font-size="28">Trending guardrails</text><text x="40" y="92" class="muted">Momentum matters, monopoly does not.</text><g transform="translate(40 140)"><circle cx="42" cy="42" r="42" fill="#312e81"/><text x="42" y="51" text-anchor="middle" fill="#c4b5fd" font-size="28" font-weight="900">2×</text><text x="110" y="36" fill="#fff" font-size="21" font-weight="800">max per artist</text><text x="110" y="65" class="muted">on the trending chart</text></g><g transform="translate(40 270)"><path d="M0 78h310" stroke="#334155" stroke-width="10" stroke-linecap="round"/><path d="M0 78h208" stroke="url(#p)" stroke-width="10" stroke-linecap="round"/><circle cx="208" cy="78" r="16" fill="#f9a8d4"/><text x="0" y="35" fill="#fff" font-size="21" font-weight="800">signals, not status</text><text x="0" y="125" class="muted">plays • likes • comments • reposts</text></g><rect x="40" y="392" width="350" height="62" rx="16" fill="#111b32"/><text x="215" y="430" text-anchor="middle" fill="#e0e7ff" font-size="19" font-weight="700">equal chance ≠ equal outcome</text></g></svg>