<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
    <title id="title">MusicCloud platform overview</title><desc id="desc">A visual map from wallet-native identity through fair discovery to creator-owned drops and realtime community.</desc>
    <defs>
      <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#090b18"/><stop offset="1" stop-color="#1b1237"/></linearGradient>
      <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
      <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
      <linearGradient id="lime" x1="0" x2="1"><stop stop-color="#bef264"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
      <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".35"/></filter>
      <style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} .eyebrow{font-size:18px;letter-spacing:4px;text-transform:uppercase;font-weight:700;fill:#a5b4fc}.label{font-size:28px;font-weight:800;fill:#fff}.copy{font-size:20px;fill:#cbd5e1}.small{font-size:17px;fill:#94a3b8}</style>
    </defs>
    <rect width="1600" height="760" rx="34" fill="url(#bg)"/>
    <circle cx="1400" cy="100" r="220" fill="#7c3aed" opacity=".15"/><circle cx="170" cy="710" r="260" fill="#06b6d4" opacity=".10"/>
    <text x="90" y="90" class="eyebrow">MUSICCLOUD / PRODUCT MAP</text>
    <text x="90" y="150" font-size="56" font-weight="900" fill="#fff">A better loop for independent music.</text>
    <text x="90" y="192" class="copy">Wallet-native identity. Fair turns in discovery. Creator-owned upside.</text>
    <path d="M430 390H560M1035 390H1160" stroke="#64748b" stroke-width="3" stroke-dasharray="10 12"/>
    <path d="M548 380l16 10-16 10M1148 380l16 10-16 10" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    <g filter="url(#shadow)"><rect x="90" y="285" width="340" height="220" rx="26" fill="#111827" stroke="#6366f1" stroke-width="2"/><circle cx="150" cy="350" r="34" fill="#312e81"/><path d="M138 350h24M150 338v24" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round"/><text x="110" y="415" class="label">01 / Identity</text><text x="110" y="450" class="copy">Connect a wallet.</text><text x="110" y="478" class="small">No email. No password. Sign to enter.</text></g>
    <g filter="url(#shadow)"><rect x="560" y="245" width="475" height="300" rx="26" fill="#111827" stroke="#22d3ee" stroke-width="2"/><circle cx="630" cy="315" r="34" fill="#164e63"/><path d="M614 324l13-17 11 9 15-20" fill="none" stroke="#67e8f9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="386" class="label">02 / Discovery</text><text x="590" y="426" class="copy">Everyone gets a turn.</text><text x="590" y="461" class="small">Rotation is based on time since last feature,</text><text x="590" y="489" class="small">not follower count. Trending caps one artist at 2.</text><rect x="590" y="510" width="260" height="8" rx="4" fill="url(#cyan)"/><text x="865" y="518" class="small">anti-monopoly by design</text></g>
    <g filter="url(#shadow)"><rect x="1165" y="285" width="345" height="220" rx="26" fill="#111827" stroke="#84cc16" stroke-width="2"/><circle cx="1225" cy="350" r="34" fill="#365314"/><path d="M1211 347h28M1225 333v28" stroke="#d9f99d" stroke-width="6" stroke-linecap="round"/><text x="1185" y="415" class="label">03 / Ownership</text><text x="1185" y="450" class="copy">Mint. Collect. Share.</text><text x="1185" y="478" class="small">ERC-1155 editions on Base L2.</text></g>
    <g><rect x="390" y="620" width="820" height="70" rx="35" fill="#0f172a" stroke="#334155"/><text x="800" y="664" text-anchor="middle" font-size="22" font-weight="700" fill="#e2e8f0">LIVE SPACES  •  DMs  •  COMMENTS  •  VIDEO  •  VOICE MEMOS  •  SSE</text></g>
    </svg>